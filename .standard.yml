ignore:
  - 'test/bin/**/*'

  # CamelCase constants are the house style throughout, and renaming
  # them is a refactor rather than a reformat.
  - '**/*':
    - Naming/ConstantName

  - 'lib/compiler/parser.rb':
    # TRUE and FALSE here are the target language's booleans, -1 and 0,
    # not Ruby's long-removed constants of the same name.  The cop's
    # autocorrect silently changes the operands we emit.
    - Lint/DeprecatedConstants
    # :false and :true name generated labels; they aren't stand-ins for
    # the Ruby booleans.
    - Lint/BooleanSymbol

  - 'lib/compiler/asm/macho/object_file.rb':
    # A genuine bug rather than a formatting nit, tracked in #20.
    - Lint/DuplicateMethods
